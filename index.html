<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./Aegis_Macro_Dashboard.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis Macro - Redirecting to Dashboard</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --muted: #8b949e;
        --mint: #00e6a1;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: #ffffff;
        font-family: Inter, Arial, sans-serif;
      }
      .card {
        background: rgba(22, 27, 34, 0.9);
        border: 1px solid rgba(48, 54, 61, 0.9);
        border-radius: 16px;
        padding: 24px 28px;
        text-align: center;
        box-shadow: 0 0 25px rgba(0, 230, 161, 0.08);
      }
      .title {
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .accent {
        color: var(--mint);
      }
      a {
        color: var(--mint);
        text-decoration: none;
      }
      p {
        margin: 10px 0 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">AEGIS <span class="accent">MACRO</span></div>
      <p>Redirecting to the dashboard...</p>
      <p><a href="./Aegis_Macro_Dashboard.html">Click here if you are not redirected automatically.</a></p>
    </div>
  </body>
</html>
